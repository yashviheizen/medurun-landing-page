# Builds the landing page as a static export and publishes it to GitHub Pages.
# The repository's Pages source must be set to "GitHub Actions" for this to be
# the thing that serves the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Switches the repository's Pages source to "GitHub Actions". Without it
          # Pages keeps trying to serve the branch as static files, which is what
          # produced a 404: this repository holds Next.js source, not a built site.
          enablement: true

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          # e.g. /medurun-landing-page — read from Pages rather than hardcoded,
          # so a rename or a custom domain does not silently break every asset.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Same value, readable from the browser bundle: files in public/ are not
          # rewritten by basePath, so components prefix them themselves.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Stops Pages' Jekyll pass from dropping Next's `_next/` directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
